name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e -- --project=chromium --project=mobile-chromium --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      - name: Annota i fallimenti E2E
        if: failure()
        run: node scripts/ci-e2e-annotations.mjs
